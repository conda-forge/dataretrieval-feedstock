{% set name = "dataretrieval" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/dataretrieval-{{ version }}.tar.gz
  sha256: 1d5d8cebe92ed0b156b86e8a596457cd695ade4f40555952a089b003390f7751

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - setuptools
    # resolves the dynamic version from the sdist's PKG-INFO; without it
    # setuptools stamps the default 0.0.0 into the installed dist metadata
    - setuptools_scm
    - python {{ python_min }}
  run:
    - anyio >=4.0
    - httpx
    - pandas >=2.0.0,<4.0.0
    - python >={{ python_min }}
    - tomli >=1.1.0

test:
  imports:
    - dataretrieval
  commands:
    - pip check
    - python -c "import dataretrieval; assert dataretrieval.__version__ == '{{ version }}', dataretrieval.__version__"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/dataretrieval/
  license: CC0-1.0
  license_file: LICENSE.md
  summary: Package to obtain USGS or EPA water quality, streamflow, and metadata from web services.

extra:
  recipe-maintainers:
    - thodson-usgs
    - elbeejay
